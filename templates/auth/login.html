{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-page" aria-labelledby="auth-title">
  <div class="auth-panel">
    <div class="auth-heading">
      <h1 id="auth-title">Log in</h1>
    </div>
    {% include "auth/_google.html" %}
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}" />
      <label>Email
        <input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email" placeholder="you@example.com" />
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password" placeholder="Enter your password" />
      </label>
      <label class="check auth-remember"><input type="checkbox" name="remember" /> <span>Keep me logged in</span></label>
      <button class="btn btn-block auth-submit" type="submit">Log in</button>
    </form>
    <p class="auth-alt">New here? <a class="link" href="{{ url_for('auth.signup', next=request.args.get('next')) }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
